<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="220" viewBox="0 0 1200 220"
     role="img" aria-labelledby="title desc">
  <title id="title">Сайт для учёбы</title>
  <desc id="desc">Открой английскую колоду в браузере: выбери тему, скажи ответ, потом раскрой.</desc>

  <defs>
    <clipPath id="frame">
      <rect width="1200" height="220" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="220" fill="#12141A"/>
    <rect x="0" y="0" width="8" height="220" fill="#F05A28"/>

    <g transform="translate(56 48)">
      <text x="0" y="22"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" letter-spacing="2.4" fill="#F05A28">САЙТ / ENGLISH</text>
      <text x="0" y="78"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="40" font-weight="700" fill="#F3EEE4">Учи в браузере</text>
      <text x="0" y="118"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="22" fill="#C6C2B8">Тема. Ответ вслух. Reveal.</text>
    </g>

    <g transform="translate(720 28)">
      <rect width="432" height="164" rx="18" fill="#FBF7EF"/>
      <path d="M18 0 H86 L70 22 H18 Q18 0 18 0 Z" fill="#F05A28"/>
      <text x="28" y="16"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#FBF7EF">SITE</text>

      <text x="28" y="56"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="16" letter-spacing="1.4" fill="#8B9099">MOST FREQUENT / 53</text>
      <text x="28" y="88"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="22" font-weight="700" fill="#12141A">Classes vs structs</text>

      <rect x="28" y="108" width="216" height="36" rx="10" fill="#F05A28"/>
      <text x="44" y="132"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="18" font-weight="700" fill="#FBF7EF">Открыть колоду</text>
    </g>
  </g>
</svg>
